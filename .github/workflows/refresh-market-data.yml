name: Refresh Market Data

on:
  schedule:
    # Daily at 6:00 AM ET (10:00 UTC)
    - cron: '0 10 * * *'
  workflow_dispatch: # Allow manual trigger from GitHub UI

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Pull market data from Bridge API and update markdown files
      - name: Refresh market data
        env:
          BRIDGE_API_BASE: ${{ secrets.BRIDGE_API_BASE }}
          BRIDGE_SERVER_TOKEN: ${{ secrets.BRIDGE_SERVER_TOKEN }}
          BRIDGE_DATASET: ${{ secrets.BRIDGE_DATASET }}
        run: node scripts/refresh-market-data.mjs

      # Check if any files changed — if not, skip the rest
      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet && git diff --staged --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No market data changes this run"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Market data updated — creating PR"
          fi

      # Commit changes to a preview branch and open/update a PR
      - name: Commit and create PR
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "bamahe"
          git config user.email "barretthenry@gmail.com"

          BRANCH="market-data/auto-refresh"

          # Create or switch to the preview branch
          git checkout -B "$BRANCH"

          # Stage only content files, sitemap, and cursor
          git add content/cities/ content/counties/ public/sitemap.xml scripts/.refresh-cursor.json

          DATE=$(date +%Y-%m-%d)
          git commit -m "Market data refresh $DATE

          Automated daily refresh of city/county market stats from Stellar MLS.
          Review before merging to production."

          git push --force-with-lease origin "$BRANCH"

          # Create or update PR
          EXISTING_PR=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number' 2>/dev/null || echo "")

          if [ -n "$EXISTING_PR" ]; then
            echo "PR #$EXISTING_PR already open — updated with latest data"
          else
            gh pr create \
              --title "Market data refresh $DATE" \
              --body "$(cat <<'EOF'
          ## Summary
          - Automated daily market data refresh from Stellar MLS (Bridge API)
          - Updates median price, active listings, new listings, and avg days on market
          - Only pages with live MLS data are updated — no fabricated numbers

          ## Review checklist
          - [ ] Spot-check 2-3 city pages for reasonable numbers
          - [ ] Confirm no hallucinated data (all from API)
          - [ ] Merge when satisfied

          🤖 Generated by tbrelo market data refresh
          EOF
          )" \
              --base main \
              --head "$BRANCH"
          fi
